server {
    listen 80;
    listen [::]:80;
    server_name tokens.xingke888.com;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://tokens.xingke888.com$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tokens.xingke888.com;
    ssl_certificate /etc/letsencrypt/live/tokens.xingke888.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tokens.xingke888.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 32m;
    access_log /var/log/nginx/tokens.access.log;
    error_log /var/log/nginx/tokens.error.log;
    location / {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
}
